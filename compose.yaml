# Development setup: `docker compose up` starts all three services.
# Values written as ${NAME} come from the .env file next to this file.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # A named volume keeps the data when the container is removed.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Apply any new database migrations, then start the API server.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # "postgres" here is the service name above. Inside the Compose network,
      # services reach each other by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: http://localhost:3000
      # Optional: this computer's network address, to use the app from a phone.
      PHONE_ORIGIN: ${PHONE_ORIGIN:-}
      UPLOAD_DIR: /data/uploads
      EVAL_DIR: /eval
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      # Optional: Plaid SANDBOX keys for the pretend-bank connection.
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      # File-change events don't cross from Windows into the container,
      # so the reloader has to poll for changes instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      # Mount the source code so edits on your machine show up in the container.
      - ./backend:/app
      # Uploaded receipts live in a named volume, outside the source code.
      - uploads:/data/uploads
      # Test receipts and their labels for the evaluation script (python -m app.eval).
      - ./eval:/eval
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # This URL is used by code running in your browser, so it is localhost,
      # not the "backend" service name.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PHONE_ORIGIN: ${PHONE_ORIGIN:-}
      # Turns on file polling in next.config.ts (same reason as the backend).
      DEV_FILE_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux builds) instead of the
      # host's folder, which the mount above would otherwise put in its place.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
  frontend_node_modules:
